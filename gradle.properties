# Gradle -- tuned for the Docker/Rosetta build container, where JVM startup
# and single-threaded work are the dominant costs. The heap is sized for
# Kotlin compile + R8 + lint sharing one long-lived daemon (2G caused GC
# thrash once lint joined the same run).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
