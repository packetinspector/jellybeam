# Pinned so a fresh checkout and the build image compile with one compiler.
# Bump here and in both Dockerfiles together, then `./build.sh image`.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-linux-android", "x86_64-linux-android", "armv7-linux-androideabi"]
