[package]
name = "ass-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Full ASS/SSA subtitle rendering: Rust owns tracks, fonts, budgets and the frame; substation rasterizes."

[dependencies]
# Pure-Rust libass port. Local dev may override this with a gitignored path patch (docs/06).
substation = { git = "https://github.com/packetinspector/substation", rev = "5267857e2a739a626ecaf8123afc065f8f2a56de" }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"

[lints]
workspace = true
