[package]
name = "seerr-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# TLS choice: rustls (via ring), matching jellyfin-api's own client -- see
# that crate's lib.rs module doc comment for the reasoning (no system
# OpenSSL dependency, consistent behavior across dev/CI/notarized-release
# builds).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt", "test-util"] }

[lints]
workspace = true
